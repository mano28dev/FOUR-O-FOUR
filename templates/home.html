<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A² - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to A²</h1>
    <h2>A futuristic Agri Assistant</h2>

    <div class="card">
    <p>Upload your drone image and let A² analyze crop health instantly!</p>
    
    <form action="/upload" method="POST" enctype="multipart/form-data" class="upload-form">
        <input type="file" name="image" id="fileInput" accept="image/*" hidden>

        <div class="file-row">
            <label for="fileInput" class="custom-file-label">Choose Image</label>
            <span id="fileName" class="file-name">No file chosen</span>
            <button type="submit">Upload Image</button>
        </div>
    </form>


</div>

    <footer>
        <button class="secondary-button" onclick=location.href="/about">About A²</button>
        <p>© 2025 A² Hackathon Prototype</p>
    </footer>

    <script>
        const fileInput = document.getElementById("fileInput");
        const fileName = document.getElementById("fileName");

        fileInput.addEventListener("change", () => {
            fileName.textContent = fileInput.files.length > 0 
                ? fileInput.files[0].name 
                : "No file chosen";
        });
    </script>

</body>
</html>
